name: Daily Artha Jobs Feed

on:
  schedule:
    - cron: "30 2 * * *"   # 8:00 AM IST daily
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write

jobs:
  fetch-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch, filter, and format jobs
        env:
          ARTHA_API_KEY: ${{ secrets.ARTHA_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          API_KEY = os.environ["ARTHA_API_KEY"]
          BASE = "https://api-india.artha.link/api/v1/jobs"

          def fetch(params):
              url = f"{BASE}?{params}"
              req = urllib.request.Request(url, headers={"X-API-Key": API_KEY})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  body = json.load(resp)
                  # API wraps results as {"success":..., "data": {"items": [...]}}, not top-level "items"
                  return (body.get("data") or {}).get("items", [])

          # Primary: remote jobs across India
          remote = fetch("limit=10&location=IN&work_mode=remote&sort_by=newest")

          jobs = list(remote)
          if len(jobs) < 5:
              # Backfill with non-remote India jobs, newest first, remote ones stay first
              backfill = fetch("limit=10&location=IN&sort_by=newest")
              seen_ids = {j.get("id") for j in jobs}
              for j in backfill:
                  if j.get("id") not in seen_ids:
                      jobs.append(j)
                      seen_ids.add(j.get("id"))
                  if len(jobs) >= 5:
                      break

          jobs = jobs[:10]

          def fmt_location(j):
              parts = [p for p in [j.get("city"), j.get("state"), j.get("country")] if p]
              return ", ".join(parts)

          def fmt_experience(j):
              lo, hi, unit = j.get("exp_min"), j.get("exp_max"), j.get("exp_unit") or "Years"
              if lo is None and hi is None:
                  return None
              if lo is not None and hi is not None:
                  return f"{lo}–{hi} {unit}"
              return f"{lo if lo is not None else hi} {unit}"

          def fmt_salary(j):
              lo, hi, curr = j.get("salary_min"), j.get("salary_max"), j.get("salary_curr") or ""
              if lo is None and hi is None:
                  return None
              if lo is not None and hi is not None:
                  return f"{curr}{lo} - {curr}{hi}"
              return f"{curr}{lo if lo is not None else hi}"

          def fmt_skills(j):
              skills = j.get("skills") or []
              return " • ".join(skills) if skills else None

          lines = []
          for i, j in enumerate(jobs, start=1):
              company = j.get("company") or "A company"
              title = j.get("title")
              block = [f"{i}) {company} is hiring!", ""]
              if title:
                  block.append(f"Role: {title}")
              exp = fmt_experience(j)
              if exp:
                  block.append(f"Experience: {exp}")
              loc = fmt_location(j)
              if loc:
                  block.append(f"Location: {loc}")
              if j.get("work_mode"):
                  block.append(f"Work Mode: {j['work_mode'].title()}")
              if j.get("job_type"):
                  block.append(f"Employment: {j['job_type'].replace('-', ' ').title()}")
              skills = fmt_skills(j)
              if skills:
                  block.append(f"Skills: {skills}")
              salary = fmt_salary(j)
              if salary:
                  block.append(f"Salary: {salary}")
              block.append("")
              if j.get("url"):
                  block.append(f"Apply: {j['url']}")
              lines.append("\n".join(block))

          output = "\n\n".join(lines) if lines else "No jobs found today."

          # Write to the Actions run summary (visible in the Actions tab immediately)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(f"# Artha Jobs — {datetime.now(timezone.utc).date()}\n\n")
                  f.write("```\n" + output + "\n```\n")

          # Also save a dated file into the repo for history
          os.makedirs("jobs", exist_ok=True)
          fname = f"jobs/{datetime.now(timezone.utc).date()}.md"
          with open(fname, "w", encoding="utf-8") as f:
              f.write(output + "\n")

          print(output)
          PYEOF

      - name: Commit daily jobs file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs/
          git diff --quiet --cached || git commit -m "Daily jobs feed: $(date -u +%Y-%m-%d)"
          git push
