name: Daily Artha Jobs Feed

on:
  schedule:
    - cron: "30 2 * * *"   # 8:00 AM IST daily
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write

jobs:
  fetch-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch, filter, and format jobs
        env:
          ARTHA_API_KEY: ${{ secrets.ARTHA_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          API_KEY = os.environ["ARTHA_API_KEY"]
          BASE = "https://api-india.artha.link/api/v1/jobs"

          MAX_JOBS = 10         # full list for the newsletter; trimmed by hand for LinkedIn
          FETCH_LIMIT = 100     # API max; a wide pool gives enough fresher jobs to pick from

          def fetch(params, offset=0):
              url = f"{BASE}?limit={FETCH_LIMIT}&offset={offset}&{params}"
              req = urllib.request.Request(url, headers={"X-API-Key": API_KEY})
              for attempt in range(2):
                  try:
                      with urllib.request.urlopen(req, timeout=20) as resp:
                          body = json.load(resp)
                          # API wraps results as {"success":..., "data": {"items": [...]}}, not top-level "items"
                          return (body.get("data") or {}).get("items", [])
                  except urllib.error.HTTPError as e:
                      # 429 = rate limited; wait as told and retry once
                      if e.code == 429 and attempt == 0:
                          time.sleep(min(int(e.headers.get("Retry-After") or 10), 60))
                          continue
                      raise

          os.makedirs("jobs", exist_ok=True)
          # Old repeat-tracking file is no longer used; remove it (git add jobs/ stages the deletion)
          if os.path.exists("jobs/seen_ids.json"):
              os.remove("jobs/seen_ids.json")

          # --- Build candidate pool from several India feeds (the API has no experience filter) ---
          pool, pool_keys = [], set()
          feed_stats = []   # (feed, returned, added) for the run summary

          def dedupe_keys(j):
              # The same posting can come back under different ids, so also match on slug and company+title+city
              keys = {("id", j.get("id")), ("slug", j.get("slug"))}
              keys.add(("ctc", (j.get("company") or "").lower(), (j.get("title") or "").lower(), (j.get("city") or "").lower()))
              return {k for k in keys if k[1] is not None}

          def add_to_pool(items):
              added = 0
              for j in items:
                  keys = dedupe_keys(j)
                  if keys & pool_keys:
                      continue
                  pool_keys.update(keys)
                  pool.append(j)
                  added += 1
              return added

          # (q=fresher was dropped: the API seems to ignore q and return the plain newest feed)
          for params in (
              "location=IN&work_mode=remote&sort_by=newest",
              "location=IN&job_type=internship&sort_by=newest",   # internships are fresher-friendly by definition
          ):
              items = fetch(params)
              feed_stats.append((params, len(items), add_to_pool(items)))

          # --- Fresher ranking: lower is better ---
          FRESHER_WORDS = re.compile(r"\b(intern|internship|fresher|freshers|graduate|trainee|entry[- ]level|junior|jr)\b", re.I)
          SENIOR_WORDS = re.compile(r"\b(senior|sr|lead|principal|staff|manager|head|architect|director|expert|l[2-5]|ii|iii|iv)\b", re.I)
          # Fresher phrases and "N years of experience" patterns in the job description
          FRESHER_DESC = re.compile(
              r"\b(freshers?|fresh graduates?|recent graduates?|entry[- ]level|no (prior )?experience (is )?(required|needed))\b", re.I)
          YEARS_DESC = re.compile(
              r"(\d{1,2})\s*\+?\s*(?:(?:-|–|to)\s*\d{1,2}\s*)?\+?\s*(?:years?|yrs?)\b(?:\s+of)?(?:\s+[\w/-]+){0,3}?\s+experience"
              r"|experience(?:\s*(?:[:\-–]|of|required))*\s*(?:minimum\s*|min\.?\s*|at least\s*)?(\d{1,2})\s*\+?\s*(?:(?:-|–|to)\s*\d{1,2}\s*)?\+?\s*(?:years?|yrs?)\b", re.I)

          def to_num(v):
              try:
                  return float(v)
              except (TypeError, ValueError):
                  return None

          # Priority (lower = shown first):
          #   0 fresher / 0 yrs / intern, 1 = 1 yr, 2 = 2–5 yrs, 3 = experience not given, 4 = more than 5 yrs
          def years_rank(n):
              if n <= 0:
                  return 0
              if n <= 1:
                  return 1
              if n <= 5:
                  return 2
              return 4

          def exp_info(j):
              """(priority group, estimated min years) — years is used to sort inside a group."""
              lo = to_num(j.get("exp_min"))
              title = j.get("title") or ""
              if (j.get("job_type") or "").lower() == "internship":
                  return 0, 0
              if lo is not None:
                  return years_rank(lo), lo
              # Only a max given ("up to N years"): freshers can apply if N is small
              hi = to_num(j.get("exp_max"))
              if hi is not None and hi <= 2:
                  return (0 if hi <= 1 else 1), 0
              # Experience not given: guess from the title, then the description
              if FRESHER_WORDS.search(title):
                  return 0, 0
              if SENIOR_WORDS.search(title):
                  return 4, 99      # a senior title outweighs smaller numbers in the description
              desc = j.get("description") or ""
              years = [int(a or b) for a, b in YEARS_DESC.findall(desc) if int(a or b) <= 20]
              if years:
                  return years_rank(min(years)), min(years)
              if FRESHER_DESC.search(desc):
                  return 0, 0
              return 3, 0

          def exp_rank(j):
              return exp_info(j)[0]

          def is_remote(j):
              return (j.get("work_mode") or "").lower() == "remote"

          # Page through the all-India feed until we have enough fresher jobs (max 5 pages = 500 jobs)
          for page in range(5):
              if sum(1 for j in pool if exp_rank(j) <= 1) >= MAX_JOBS:
                  break
              items = fetch("location=IN&sort_by=newest", offset=page * FETCH_LIMIT)
              feed_stats.append((f"location=IN&sort_by=newest (page {page + 1})", len(items), add_to_pool(items)))
              if len(items) < FETCH_LIMIT:
                  break

          # Newest first, then (stable) by group, fewest years required, remote first
          pool.sort(key=lambda j: j.get("posted_date") or "", reverse=True)
          pool.sort(key=lambda j: (*exp_info(j), 0 if is_remote(j) else 1))

          jobs = pool[:MAX_JOBS]

          # --- Formatting helpers ---
          def fmt_num(v):
              return f"{v:g}" if isinstance(v, float) else str(v)

          def fmt_location(j):
              parts, seen_parts = [], set()
              for p in (j.get("city"), j.get("state"), j.get("country")):
                  if not p:
                      continue
                  p = "India" if p.strip().upper() == "IN" else p.strip()
                  if p.lower() in seen_parts:
                      continue   # avoids "India, India, India"
                  seen_parts.add(p.lower())
                  parts.append(p)
              return ", ".join(parts)

          def fmt_experience(j):
              lo, hi = to_num(j.get("exp_min")), to_num(j.get("exp_max"))
              unit = j.get("exp_unit") or "Years"
              if lo is None and hi is None:
                  return None
              if lo == 0 and (hi is None or hi == 0):
                  return "Fresher (0 Years)"
              if lo is not None and hi is not None:
                  if lo == hi:
                      return f"{fmt_num(lo)} {unit}"
                  rng = f"{fmt_num(lo)}–{fmt_num(hi)} {unit}"
                  return f"{rng} (Freshers eligible)" if lo == 0 else rng
              if lo is not None:
                  return f"{fmt_num(lo)}+ {unit}"
              return f"Up to {fmt_num(hi)} {unit} (Freshers eligible)"

          def indian_commas(n):
              s = str(int(round(n)))
              if len(s) <= 3:
                  return s
              head, tail = s[:-3], s[-3:]
              groups = []
              while len(head) > 2:
                  groups.insert(0, head[-2:])
                  head = head[:-2]
              if head:
                  groups.insert(0, head)
              return ",".join(groups) + "," + tail

          def fmt_salary(j):
              lo, hi = to_num(j.get("salary_min")), to_num(j.get("salary_max"))
              curr = (j.get("salary_curr") or "").strip()
              if lo is None and hi is None:
                  return None
              # Artha data sometimes copies the experience range into salary (e.g. "USD 1 – USD 3"); skip junk
              if (lo, hi) == (to_num(j.get("exp_min")), to_num(j.get("exp_max"))):
                  return None
              if max(v for v in (lo, hi) if v is not None) < 1000:
                  return None
              # Non-INR pay on a non-remote India job is almost always a mislabeled currency
              country = (j.get("country") or "").strip().upper()
              if country in ("IN", "INDIA") and curr.upper() not in ("INR", "₹", "RS", "RS.") and not is_remote(j):
                  return None
              vals = [v for v in (lo, hi) if v is not None]
              if lo is not None and hi is not None and lo == hi:
                  vals = [lo]
              if curr.upper() in ("INR", "₹", "RS", "RS."):
                  if all(v >= 100000 for v in vals):
                      return "₹" + "–".join(f"{v / 100000:.1f}".rstrip("0").rstrip(".") for v in vals) + " LPA"
                  return " – ".join(f"₹{indian_commas(v)}" for v in vals)
              prefix = f"{curr} " if curr else ""
              return " – ".join(f"{prefix}{v:,.0f}" for v in vals)

          def fmt_skills(j):
              skills = j.get("skills") or []
              return " • ".join(str(s) for s in skills) if skills else None

          def fmt_job_block(i, j):
              company = j.get("company") or "A company"
              title = j.get("title")
              block = [f"{i}) {company} is hiring!", ""]
              if title:
                  block.append(f"Role: {title}")
              exp = fmt_experience(j)
              if exp:
                  block.append(f"Experience: {exp}")
              loc = fmt_location(j)
              if loc:
                  block.append(f"Location: {loc}")
              if j.get("work_mode"):
                  block.append(f"Work Mode: {j['work_mode'].title()}")
              if j.get("job_type"):
                  block.append(f"Employment: {j['job_type'].replace('-', ' ').title()}")
              skills = fmt_skills(j)
              if skills:
                  block.append(f"Skills: {skills}")
              salary = fmt_salary(j)
              if salary:
                  block.append(f"Salary: {salary}")
              block.append("")
              slug = j.get("slug")
              if slug:
                  block.append(f"Apply: https://artha.link/@arijit_ghosh/jobs/{slug}")
              elif j.get("url"):
                  block.append(f"Apply: {j['url']}")
              return "\n".join(block)

          # Keyword -> hashtag map, matched as whole words against each job's title + skills (case-insensitive)
          KEYWORD_HASHTAGS = [
              ("machine learning", "#AIEngineering"), ("ai", "#AIEngineering"), ("ml", "#AIEngineering"),
              ("artificial intelligence", "#AIEngineering"),
              ("data", "#DataEngineering"),
              ("backend", "#BackendDeveloper"),
              ("frontend", "#FrontendDeveloper"),
              ("full stack", "#FullStackDeveloper"), ("full-stack", "#FullStackDeveloper"),
              ("devops", "#DevOpsJobs"),
              ("cloud", "#CloudJobs"), ("aws", "#CloudJobs"), ("azure", "#CloudJobs"),
              ("blockchain", "#BlockchainJobs"), ("web3", "#BlockchainJobs"),
              ("security", "#CyberSecurity"),
              ("network", "#NetworkEngineering"),
              ("python", "#PythonJobs"),
              ("java", "#JavaJobs"),
              ("react", "#ReactJobs"), ("javascript", "#JavaScriptJobs"), ("node", "#NodeJS"), ("nodejs", "#NodeJS"),
              ("android", "#AndroidDeveloper"), ("ios", "#iOSDeveloper"),
              ("qa", "#QAJobs"), ("testing", "#QAJobs"), ("tester", "#QAJobs"), ("sdet", "#QAJobs"),
              ("product manager", "#ProductManagement"),
          ]

          def hashtags_for(batch):
              tags = []
              if any(exp_rank(j) == 0 for j in batch):
                  tags.append("#FresherJobs")
              tags += ["#TechJobs", "#HiringIndia", "#LinkedInJobs"]
              haystack = " ".join(
                  (j.get("title") or "") + " " + " ".join(str(s) for s in (j.get("skills") or []))
                  for j in batch
              ).lower()
              for keyword, tag in KEYWORD_HASHTAGS:
                  if len(tags) >= 8:
                      break
                  if tag not in tags and re.search(rf"\b{re.escape(keyword)}\b", haystack):
                      tags.append(tag)
              return " ".join(tags)

          def build_post(batch):
              fresher = all(exp_rank(j) <= 1 for j in batch)
              label = ("Multiple " if len(batch) > 1 else "") + ("Fresher " if fresher else "") + "Hiring Alert"
              header = f"\U0001f6a8 {label} - Apply Now \U0001f6a8"
              job_blocks = [fmt_job_block(i + 1, j) for i, j in enumerate(batch)]
              footer = (
                  "Save this for later or send it to someone job hunting.\n\n"
                  "➕ Must follow and join my communities for more —\n"
                  "1) WhatsApp: https://lnkd.in/gxMnPd8Z\n"
                  "2) Telegram: https://lnkd.in/ghHMXg2Q\n\n"
                  + hashtags_for(batch)
              )
              return header + "\n\n" + "\n\n".join(job_blocks) + "\n\n" + footer

          output = build_post(jobs) if jobs else None

          today = datetime.now(timezone.utc).date()
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          # Diagnostics: how many jobs each feed returned, and the experience mix of the pool
          RANK_NAMES = {0: "fresher / 0 yrs / intern", 1: "1 yr", 2: "2–5 yrs", 3: "exp not given", 4: "5+ yrs"}
          diag = ["| Feed | Returned | New (not dupes) |", "|---|---|---|"]
          diag += [f"| `{p}` | {n} | {a} |" for p, n, a in feed_stats]
          diag += ["", "| Experience level | Jobs in pool |", "|---|---|"]
          diag += [f"| {RANK_NAMES[r]} | {sum(1 for j in pool if exp_rank(j) == r)} |" for r in range(5)]
          diag += ["", "Picked: " + ", ".join(RANK_NAMES[exp_rank(j)] for j in jobs)]
          diag_text = "\n".join(diag) + "\n\n"
          print(diag_text)

          if not jobs:
              print("No new jobs found today; nothing to commit.")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as f:
                      f.write(f"# Artha Jobs — {today}\n\n" + diag_text + "No new jobs found today.\n")
              raise SystemExit(0)

          # Write to the Actions run summary (visible in the Actions tab immediately)
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(f"# Artha Jobs — {today}\n\n")
                  f.write(diag_text)
                  f.write(f"{len(jobs)} jobs, {len(output)} characters\n\n")
                  f.write("```\n" + output + "\n```\n")

          # Save a dated file into the repo for history
          with open(f"jobs/{today}.md", "w", encoding="utf-8") as f:
              f.write(output + "\n")

          print(output)
          PYEOF

      - name: Commit daily jobs file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs/
          git diff --quiet --cached || git commit -m "Daily jobs feed: $(date -u +%Y-%m-%d)"
          git push
